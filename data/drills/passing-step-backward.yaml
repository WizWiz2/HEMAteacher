id: passing-step-backward
name: Проходной шаг назад
description: Передняя нога проходит назад, после чего стойка меняет ведущую ногу.
cameraView: side
category: footwork
trackingMode: full_body
weaponTracking: none
unvalidated: true
checkpoints:
  - id: start
    title: Старт
    targetPoseId: stance-right
    holdMs: 350

    passThreshold: 0.65
    featureTolerances:
      left_ankle_x: 0.34
      right_ankle_x: 0.34
      foot_distance: 0.30
      pelvis_height: 0.28
      torso_angle: 18
  - id: cross
    title: Стопы проходят рядом
    targetPoseId: stance-cross
    holdMs: 60

    passThreshold: 0.65
    smoothingMs: 70
    featureTolerances:
      left_ankle_x: 0.34
      right_ankle_x: 0.34
      foot_distance: 0.30
      pelvis_height: 0.28
      torso_angle: 18
  - id: reach
    title: Нога уходит назад
    targetPoseId: stance-wide-left
    holdMs: 80

    passThreshold: 0.65
    smoothingMs: 80
    featureTolerances:
      left_ankle_x: 0.34
      right_ankle_x: 0.34
      foot_distance: 0.30
      pelvis_height: 0.28
      torso_angle: 18
  - id: settle
    title: Новая стойка
    targetPoseId: stance-left
    holdMs: 320

    passThreshold: 0.65
    featureTolerances:
      left_ankle_x: 0.34
      right_ankle_x: 0.34
      foot_distance: 0.30
      pelvis_height: 0.28
      torso_angle: 18
transitions: []
