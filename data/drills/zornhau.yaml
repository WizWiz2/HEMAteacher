id: zornhau
name: Zornhau
description: Прототип Zornhau с проходным шагом. Нужен для проверки игрового loop, а не как окончательная реконструкция техники.
cameraView: side
category: meisterhau
trackingMode: full_body
weaponTracking: optional
unvalidated: true
limitations:
  - "Без цветных меток matcher проверяет тело, руки и ноги. С двумя яркими метками дополнительно оценивается примерная линия клинка."
checkpoints:
  - id: guard
    title: Vom Tag
    targetPoseId: vom-tag
    holdMs: 350

    passThreshold: 0.62
    featureTolerances:
      hand_center_x: 0.42
      hand_center_y: 0.38
      hand_distance: 0.35
      left_elbow_angle: 45
      right_elbow_angle: 45
      foot_distance: 0.38
      pelvis_height: 0.32
      torso_angle: 22
  - id: init
    title: Начало рубки
    targetPoseId: zorn-init
    holdMs: 70

    passThreshold: 0.62
    smoothingMs: 80
    featureTolerances:
      hand_center_x: 0.42
      hand_center_y: 0.38
      hand_distance: 0.35
      left_elbow_angle: 45
      right_elbow_angle: 45
      foot_distance: 0.38
      pelvis_height: 0.32
      torso_angle: 22
  - id: extend
    title: Выход в удар
    targetPoseId: zorn-extend
    holdMs: 80

    passThreshold: 0.62
    smoothingMs: 80
    featureTolerances:
      hand_center_x: 0.42
      hand_center_y: 0.38
      hand_distance: 0.35
      left_elbow_angle: 45
      right_elbow_angle: 45
      foot_distance: 0.38
      pelvis_height: 0.32
      torso_angle: 22
  - id: finish
    title: Завершение
    targetPoseId: zorn-finish
    holdMs: 280

    passThreshold: 0.62
    featureTolerances:
      hand_center_x: 0.42
      hand_center_y: 0.38
      hand_distance: 0.35
      left_elbow_angle: 45
      right_elbow_angle: 45
      foot_distance: 0.38
      pelvis_height: 0.32
      torso_angle: 22
transitions: []
