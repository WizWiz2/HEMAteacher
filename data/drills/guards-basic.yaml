id: guards-basic
name: Четыре базовые позиции
description: Ознакомительный drill по Vom Tag, Ochs, Pflug и Alber.
cameraView: side
category: guards
trackingMode: upper_body
weaponTracking: optional
unvalidated: true
limitations:
  - "Без цветных меток приложение оценивает положение тела и рук, но не линию клинка."
checkpoints:
  - id: vom-tag
    title: Vom Tag
    targetPoseId: vom-tag
    holdMs: 350
    passThreshold: 0.55
    requiredFeatures: [hand_center_y, hand_center_x]
    cue: Меч у правого плеча. Правая кисть у гарды, левая ниже на рукояти. Локти опусти; лицо остаётся открытым.
    featureTolerances:
      hand_center_x: 0.46
      hand_center_y: 0.42
      hand_distance: 0.36
      left_elbow_angle: 48
      right_elbow_angle: 48
      torso_angle: 24
    weights:
      hand_center_y: 1.5
      torso_angle: 1.2
      hand_center_x: 0.8
      hand_distance: 0.5
      left_elbow_angle: 0.6
      right_elbow_angle: 0.6

  - id: ochs
    title: Ochs
    targetPoseId: ochs
    holdMs: 350
    passThreshold: 0.58
    requiredFeatures: [hand_center_y]
    cue: Руки высоко; без маркеров меча острие остаётся визуальным ориентиром.
    featureTolerances:
      hand_center_x: 0.46
      hand_center_y: 0.42
      hand_distance: 0.36
      left_elbow_angle: 48
      right_elbow_angle: 48
      torso_angle: 24
    weights:
      hand_center_y: 1.5
      torso_angle: 1.2

  - id: pflug
    title: Pflug
    targetPoseId: pflug
    holdMs: 350
    passThreshold: 0.58
    requiredFeatures: [hand_center_y]
    cue: Руки ниже; корпус остаётся собранным.
    featureTolerances:
      hand_center_x: 0.46
      hand_center_y: 0.42
      hand_distance: 0.36
      left_elbow_angle: 48
      right_elbow_angle: 48
      torso_angle: 24
    weights:
      hand_center_y: 1.5
      torso_angle: 1.2

  - id: alber
    title: Alber
    targetPoseId: alber
    holdMs: 350
    passThreshold: 0.58
    requiredFeatures: [hand_center_y]
    cue: Низкая позиция рук. Линия клинка проверяется только в маркерном режиме.
    featureTolerances:
      hand_center_x: 0.46
      hand_center_y: 0.42
      hand_distance: 0.36
      left_elbow_angle: 48
      right_elbow_angle: 48
      torso_angle: 24
    weights:
      hand_center_y: 1.5
      torso_angle: 1.2
transitions: []
