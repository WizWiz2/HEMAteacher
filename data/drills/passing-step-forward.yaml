id: passing-step-forward
name: Проходной шаг вперёд
description: Задняя нога проходит вперёд и становится новой передней ногой.
cameraView: side
category: footwork
unvalidated: true
checkpoints:
  - id: start
    title: Старт
    targetPoseId: stance-left
    holdMs: 350
    featureTolerances:
      left_ankle_x: 0.28
      right_ankle_x: 0.28
      foot_distance: 0.24
      pelvis_height: 0.22
      torso_angle: 14
  - id: compact
    title: Собери шаг
    targetPoseId: stance-compact-left
    holdMs: 70
    smoothingMs: 80
    featureTolerances:
      left_ankle_x: 0.28
      right_ankle_x: 0.28
      foot_distance: 0.24
      pelvis_height: 0.22
      torso_angle: 14
  - id: cross
    title: Стопы проходят рядом
    targetPoseId: stance-cross
    holdMs: 60
    smoothingMs: 70
    cue: Не замирай — просто пройди через эту фазу.
    featureTolerances:
      left_ankle_x: 0.28
      right_ankle_x: 0.28
      foot_distance: 0.24
      pelvis_height: 0.22
      torso_angle: 14
  - id: reach
    title: Новая нога впереди
    targetPoseId: stance-wide-right
    holdMs: 80
    smoothingMs: 80
    featureTolerances:
      left_ankle_x: 0.28
      right_ankle_x: 0.28
      foot_distance: 0.24
      pelvis_height: 0.22
      torso_angle: 14
  - id: settle
    title: Новая стойка
    targetPoseId: stance-right
    holdMs: 320
    featureTolerances:
      left_ankle_x: 0.28
      right_ankle_x: 0.28
      foot_distance: 0.24
      pelvis_height: 0.22
      torso_angle: 14
transitions: []
