name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m py_compile launcher.py
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: python scripts/export_static_content.py --check
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Validate Vom Tag against labelled Zornhau clips
        run: node scripts/check-vom-tag-clips.mjs
        working-directory: frontend
      - name: Validate continuous movement on recorded MediaPipe poses
        run: |
          node frontend/scripts/build-motion-patterns.mjs --check
          node frontend/scripts/check-motion-scenarios.mjs
      - name: Validate standalone Sites output
        run: |
          node scripts/build-site.mjs
          node scripts/check-static-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hematrainer-static
          path: dist/
          if-no-files-found: error

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python launcher
        shell: cmd
        run: python -m py_compile launcher.py
      - name: Validate launcher CLI
        shell: cmd
        run: python launcher.py --help
      - name: Ensure PowerShell launcher is gone
        shell: cmd
        run: |
          if exist start.ps1 exit /b 1
          findstr /I /C:"powershell" start.bat && exit /b 1 || exit /b 0
