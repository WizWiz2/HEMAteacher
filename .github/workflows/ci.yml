name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m py_compile launcher.py
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python launcher
        shell: cmd
        run: python -m py_compile launcher.py
      - name: Validate launcher CLI
        shell: cmd
        run: python launcher.py --help
      - name: Ensure PowerShell launcher is gone
        shell: powershell
        run: |
          if (Test-Path .\start.ps1) {
            throw "start.ps1 must not exist"
          }
          if (-not (Select-String -Path .\start.bat -Pattern "launcher.py" -Quiet)) {
            throw "start.bat does not invoke launcher.py"
          }
