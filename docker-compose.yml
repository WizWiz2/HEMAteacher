services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HEMA_ROOT: /app
      HEMA_DATA: /data
      HEMA_CONFIG: /app/config/settings.yaml
      HEMA_MODEL: /app/models/pose_landmarker_full.task
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
